# ZeitTrack — local development stack with hot reload.
#
# Start everything with one command (no .env file needed):
#
#   docker compose -f docker-compose.dev.yml up --build --watch
#
# Then open http://localhost:3000 in your browser.
# Changes to any file inside src/ appear within ~1 second via Next.js HMR.
#
# The --watch flag activates Docker Compose Watch, which uses Docker's
# internal file transfer API to sync host changes into the container.
# This bypasses VirtioFS (the macOS Apple Silicon file-sharing layer that
# returns EDEADLK on concurrent reads from bind-mounts).
#
# First run loads demo data automatically (RUN_SEED defaults to true).
# To skip seeding on a subsequent rebuild, pass RUN_SEED=false:
#
#   RUN_SEED=false docker compose -f docker-compose.dev.yml up --build --watch
#
# After changing package.json or prisma/schema.prisma, Compose Watch
# automatically rebuilds the image and restarts the app container.

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zeittrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-zeittrack_dev}
      POSTGRES_DB: ${POSTGRES_DB:-zeittrack}
    volumes:
      - db-data-dev:/var/lib/postgresql/data
    # Uncomment to connect with TablePlus / DBeaver (use port 5433 to avoid
    # clashing with any local PostgreSQL installation on your machine):
    # ports:
    #   - "127.0.0.1:5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zeittrack} -d ${POSTGRES_DB:-zeittrack}"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      target: migrator
    environment:
      # Uses the Docker-internal hostname "db", not localhost.
      DATABASE_URL: postgresql://zeittrack:${POSTGRES_PASSWORD:-zeittrack_dev}@db:5432/zeittrack?schema=public
      RUN_SEED: ${RUN_SEED:-true}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      # DATABASE_URL is defined here (not read from .env) so it always points
      # to the "db" service on the Docker-internal network, not localhost.
      DATABASE_URL: postgresql://zeittrack:${POSTGRES_PASSWORD:-zeittrack_dev}@db:5432/zeittrack?schema=public
      AUTH_SECRET: ${AUTH_SECRET:-zeittrack-local-dev-secret-not-for-production}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      NEXTAUTH_URL: ${NEXTAUTH_URL:-http://localhost:3000}
    volumes:
      # Anonymous volume keeps the Linux Prisma client (generated inside the
      # image) from being overwritten if Compose Watch syncs src/ files.
      - /app/src/generated
    develop:
      watch:
        # sync: transfer changed files from host into the container using
        # Docker's internal API (not VirtioFS), so Next.js HMR picks them up.
        - action: sync
          path: ./src
          target: /app/src
          ignore:
            - generated/**
        - action: sync
          path: ./public
          target: /app/public
        # rebuild: restart the container when these files change (they affect
        # the image or Next.js config, not just runtime source).
        - action: rebuild
          path: package.json
        - action: rebuild
          path: package-lock.json
        - action: rebuild
          path: prisma/schema.prisma
        - action: rebuild
          path: next.config.ts
        - action: rebuild
          path: tsconfig.json
        - action: rebuild
          path: postcss.config.mjs
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-3000}:3000"

volumes:
  db-data-dev:
