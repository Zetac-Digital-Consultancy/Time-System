# ZeitTrack — full stack for a Linux host.
# Usage:
#   cp .env.example .env   # then edit secrets
#   docker compose up -d --build
#
# No demo seeding. Read docs/PRODUCTION.md before upgrading an existing DB.

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-zeittrack}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-zeittrack}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-zeittrack} -d ${POSTGRES_DB:-zeittrack}"]
      interval: 5s
      timeout: 5s
      retries: 10
    # Not published to the host by default. Uncomment to access Postgres
    # directly (e.g. for backups) — restrict to localhost.
    # ports:
    #   - "127.0.0.1:5432:5432"

  # One-shot: applies reviewed production migrations.
  migrate:
    build:
      context: .
      target: migrator
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_URL: ${AUTH_URL:?set HTTPS AUTH_URL in .env}
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TZ: Europe/Berlin
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env}
      AUTH_URL: ${AUTH_URL:?set HTTPS AUTH_URL in .env}
      AUTH_TRUST_HOST: ${AUTH_TRUST_HOST:-true}
      # Register with the shared nginx-proxy + acme-companion for HTTPS on its subdomain
      VIRTUAL_HOST: time-system.zetac.de
      VIRTUAL_PORT: "3000"
      LETSENCRYPT_HOST: time-system.zetac.de
      LETSENCRYPT_EMAIL: info@zetac.de
    networks:
      - default
      - proxy
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # Reachable only via the shared nginx-proxy (time-system.zetac.de); no public host port.
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  # default: implicit per-stack bridge (app <-> db <-> migrate)
  default:
  # shared reverse-proxy network, created/owned by /root/reverse-proxy
  proxy:
    external: true

volumes:
  db-data:
